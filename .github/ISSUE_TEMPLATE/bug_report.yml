name: Bug Report
description: Report an issue or unexpected behavior in PackAI CLI or provisioning
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.
  - type: input
    id: version
    attributes:
      label: PackAI Version
      description: What version of PackAI are you running? (Run `packai --version`)
      placeholder: "e.g. 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Darwin arm64)
        - macOS (Darwin x64)
        - Linux (Ubuntu/Debian)
        - Linux (Arch/Fedora/Other)
        - Windows (WSL2)
        - Windows (PowerShell/CMD)
    validations:
      required: true
  - type: dropdown
    id: target_client
    attributes:
      label: Target AI Client
      description: Which agent client or IDE were you provisioning for?
      options:
        - Claude Code
        - Cursor (.cursorrules / .cursor/rules/*.mdc)
        - Windsurf
        - Roo-Code / Cline
        - GitHub Copilot
        - All / Multiple
        - Standalone Runner (packai run)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior? Provide commands and minimal manifest if possible.
      placeholder: |
        1. Run `packai init ...`
        2. Run `packai apply ...`
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Output & Logs
      description: Paste terminal output or error stack trace here.
      render: shell
