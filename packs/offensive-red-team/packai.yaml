spec_version: '2.0'
name: offensive-red-team
version: '1.0.0'
description: 'Autonomous Red Team & Cyber Warfare multi-agent suite with recon, exploit synthesis, and security audit agents.'
author:
  name: GÖKBÖRÜ
  github: Enis-Atilgan
category: security
level: system
license: MIT
tags:
  - security
  - red-team
  - pentest
  - offensive
  - multi-agent

requirements:
  platform:
    os:
      - darwin
      - linux
    min_ram_gb: 8
  binaries:
    - python3
    - nmap
  secrets:
    - SHODAN_API_KEY

execution:
  command: python3 runner.py
  entrypoint: runner.py
  timeout_seconds: 300

agents:
  - id: recon-lead
    name: Reconnaissance Specialist
    description: Passive and active target discovery, port scanning, and subdomain enumeration.
    model_preference: smart
    persona:
      role: Reconnaissance Specialist
      instructions: Master of network scanning, DNS enumeration, Shodan intelligence, and attack surface mapping.
  - id: exploit-synthesizer
    name: Weaponization & Exploit Synthesizer
    description: Fuzzing, bypass payload generation, and proof-of-concept synthesis.
    model_preference: smart
    persona:
      role: Exploit Synthesizer
      instructions: Surgical creator of bypass payloads (WAF, SQLi, XSS, SSRF, RCE) and exploit automation scripts.
  - id: sec-auditor
    name: Penetration Test Auditor
    description: Validates findings, calculates CVSS scores, and writes executive remediation reports.
    model_preference: smart
    persona:
      role: Security Auditor
      instructions: Meticulous auditor validating vulnerabilities against OWASP Top 10 and NIST frameworks.

rules:
  file: AGENTS.md
