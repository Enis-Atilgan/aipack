spec_version: '2.0'
name: cloud-sec-auditor
version: '1.0.0'
description: 'Cloud Infrastructure Guardian for AWS, GCP, and Terraform security compliance and IAM auditing.'
author:
  name: GÖKBÖRÜ
  github: Enis-Atilgan
category: security
level: enhanced
license: MIT
tags:
  - aws
  - gcp
  - cloud
  - terraform
  - iam
  - security
  - compliance

requirements:
  platform:
    os:
      - darwin
      - linux
      - win32
    min_ram_gb: 4
  binaries:
    - aws
    - terraform
  secrets:
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY

persona:
  role: Cloud Security Auditor
  instructions: Expert in cloud posture management (CSPM), AWS Well-Architected Framework, least-privilege IAM policies, and Terraform static analysis.

rules:
  file: AGENTS.md
