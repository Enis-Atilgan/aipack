spec_version: '2.0'
name: fullstack-nextjs-architect
version: '1.0.0'
description: 'Full-Stack Next.js 16, React 19, Tailwind and Supabase autonomous engineering workforce.'
author:
  name: GÖKBÖRÜ
  github: Enis-Atilgan
category: coding
level: system
license: MIT
tags:
  - nextjs
  - react
  - fullstack
  - supabase
  - tailwind
  - saas

requirements:
  platform:
    os:
      - darwin
      - linux
      - win32
    min_ram_gb: 8
  binaries:
    - node
    - npm
  secrets:
    - NEXT_PUBLIC_SUPABASE_URL
    - SUPABASE_SERVICE_ROLE_KEY

agents:
  - id: lead-architect
    name: System Architect & Lead
    description: Oversees architectural integrity, data models, schema migrations, and API contracts.
    model_preference: smart
    persona:
      role: Lead Software Architect
      instructions: Designs modular, scalable Next.js systems. Enforces single responsibility and type safety.
  - id: frontend-engineer
    name: Frontend & UI Engineer
    description: React 19 Server Components, Tailwind CSS, accessibility, micro-animations, and client UX.
    model_preference: smart
    persona:
      role: Senior Frontend Engineer
      instructions: Crafts responsive, accessible UI components with Tailwind CSS and React 19.
  - id: backend-engineer
    name: Backend & Database Specialist
    description: Supabase PostgreSQL, Row Level Security (RLS) policies, Server Actions, and Stripe webhooks.
    model_preference: smart
    persona:
      role: Backend & DB Engineer
      instructions: Implements secure Server Actions, PostgreSQL RLS policies, migrations, and third-party APIs.
  - id: qa-reviewer
    name: QA & Security Auditor
    description: Code review, automated test coverage, type checking, and security boundary validation.
    model_preference: fast
    persona:
      role: QA & Code Reviewer
      instructions: Reviews diffs, writes Vitest/Playwright tests, and flags security vulnerabilities.

rules:
  file: AGENTS.md
